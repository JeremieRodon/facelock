[package]
name = "facelock-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
zvariant = { version = "5", default-features = false, features = ["enumflags2"] }
# The purge engine (src/purge/) is descriptor-anchored syscall work: openat,
# fstatat, renameat2, unlinkat, fdopendir. libc only — no nix, no rustix.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
zvariant = { version = "5", default-features = false, features = ["enumflags2"] }
