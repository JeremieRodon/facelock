[package]
name = "facelock-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "facelock_daemon"
path = "src/lib.rs"

[dependencies]
facelock-core = { path = "../facelock-core" }
facelock-camera = { path = "../facelock-camera" }
facelock-face = { path = "../facelock-face" }
facelock-store = { path = "../facelock-store" }
signal-hook = "0.4"
tracing.workspace = true
tracing-subscriber.workspace = true
nix = { version = "0.31", features = ["socket", "user", "fs"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
facelock-tpm = { path = "../facelock-tpm" }
bytemuck = { version = "1", features = ["derive"] }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
# The D-Bus server (src/server.rs) — async service, runtime, and the
# signal/sleep watchers. libc backs the post-init capability drop.
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
futures-util = "0.3"
libc = "0.2"

[features]
tpm = ["facelock-tpm/tpm"]

[dev-dependencies]
# Schema-level failure injection lives in facelock-test-support::schema_faults,
# which owns the rusqlite dependency it needs.
facelock-test-support = { path = "../facelock-test-support" }
tempfile = "3"
